[package]
name = "web-faith-dns"
description = "A caching DNS resolver: transports, server order, HTTPS records, and Happy Eyeballs"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/web-faith-dns"
authors.workspace = true

[dependencies]
futures.workspace = true
hickory-resolver.workspace = true
moka.workspace = true
tokio.workspace = true
url.workspace = true
reqwest = { workspace = true, optional = true }

[dev-dependencies]
# Examples link as their own crate, so the runtime they need has to be named there too.
tokio = { workspace = true }

[features]
# Implement reqwest's `Resolve`, so the resolver can be installed on its client.
reqwest = ["dep:reqwest", "reqwest/hickory-dns"]

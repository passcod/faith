[package]
name = "web-faith"
description = "A browser-shaped HTTP client: fetch semantics over a Rust network stack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Flipped on once the client API is built out and the release tooling is in place.
publish = false

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
http-cache-reqwest.workspace = true
hyper.workspace = true
hyper-util.workspace = true
moka.workspace = true
reqwest.workspace = true
reqwest-middleware.workspace = true
serde.workspace = true
serde_json.workspace = true
stream_shared.workspace = true
ssri.workspace = true
strum.workspace = true
tokio.workspace = true
url.workspace = true
web-faith-conn-tracker.workspace = true
web-faith-encoding.workspace = true
web-faith-cookies = { workspace = true, features = ["reqwest"], optional = true }
web-faith-dns = { workspace = true, features = ["reqwest"], optional = true }
web-faith-alt-svc = { workspace = true, optional = true }

[features]
default = ["cookies", "dns", "http3"]
# The cookie jar, and the agent option and handle that reach it.
cookies = ["dep:web-faith-cookies", "reqwest/cookies"]
# Faith's own caching resolver, which a prefetch warms and an `HTTPS` record lookup reads.
# Without it names resolve through the platform, as reqwest resolves them.
dns = ["dep:web-faith-dns", "reqwest/hickory-dns", "web-faith-alt-svc?/dns"]
# Transparent HTTP/3, and the Alt-Svc machinery that upgrades an origin to it.
http3 = ["reqwest/http3", "dep:web-faith-alt-svc"]

[package]
name = "web-faith"
description = "A browser-shaped HTTP client: fetch semantics over a Rust network stack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Flipped on once the client API is built out and the release tooling is in place.
publish = false

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
http.workspace = true
http-body-util.workspace = true
http-cache-reqwest.workspace = true
hyper.workspace = true
reqwest.workspace = true
reqwest-middleware.workspace = true
stream_shared.workspace = true
strum.workspace = true
tokio.workspace = true
url.workspace = true
web-faith-cookies = { workspace = true, features = ["reqwest"] }
web-faith-dns = { workspace = true, features = ["reqwest"] }
web-faith-alt-svc = { workspace = true, optional = true }
web-faith-integrity = { workspace = true, optional = true }

[features]
default = ["http3", "integrity"]
# Transparent HTTP/3, and the Alt-Svc machinery that upgrades an origin to it.
http3 = ["reqwest/http3", "dep:web-faith-alt-svc"]
# Subresource Integrity: parsing and verifying `integrity` values.
integrity = ["dep:web-faith-integrity"]

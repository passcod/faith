[package]
name = "web-faith"
description = "A browser-shaped HTTP client"
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/web-faith"
readme = "README.md"
authors.workspace = true

[package.metadata.docs.rs]
features = ["http3", "raw-client"]
rustc-args = ["--cfg", "reqwest_unstable"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
async-trait.workspace = true
bon.workspace = true
bytes.workspace = true
futures.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
http-cache-reqwest = { workspace = true, optional = true }
hyper.workspace = true
hyper-util.workspace = true
moka.workspace = true
reqwest.workspace = true
rustls = { workspace = true, optional = true }
reqwest-middleware.workspace = true
serde.workspace = true
serde_json.workspace = true
stream_shared.workspace = true
ssri.workspace = true
strum.workspace = true
tokio.workspace = true
url.workspace = true
web-faith-conn-tracker = { workspace = true, optional = true }
web-faith-encoding = { workspace = true, optional = true }
web-faith-cookies = { workspace = true, features = ["reqwest"], optional = true }
web-faith-dns = { workspace = true, features = ["reqwest"], optional = true }
web-faith-alt-svc = { workspace = true, optional = true }

[dev-dependencies]
futures.workspace = true
http-body-util.workspace = true
serde.workspace = true
tokio = { workspace = true }

[features]
default = [
    "cache",
    "connection-tracking",
    "cookies",
    "dns",
    "encoding",
    "tls-aws-lc-rs",
]
cache = ["dep:http-cache-reqwest"]
connection-tracking = ["dep:web-faith-conn-tracker"]
cookies = ["dep:web-faith-cookies", "reqwest/cookies"]
dns = ["dep:web-faith-dns", "reqwest/hickory-dns", "web-faith-alt-svc?/dns"]
encoding = ["dep:web-faith-encoding"]
# Needs the consuming build to set `RUSTFLAGS="--cfg reqwest_unstable"`.
http3 = ["reqwest/http3", "tls-aws-lc-rs", "dep:web-faith-alt-svc"]
tls-aws-lc-rs = ["reqwest/rustls"]
tls-ring = ["reqwest/rustls-no-provider", "dep:rustls", "rustls/ring"]
raw-client = []
unstable-internals = ["raw-client"]

[package]
name = "web-faith-napi"
description = "Faith: a Rust-powered JS fetch (Node.js binding)"
# Written by `npm run version` from package.json.
version = "1.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# Kept as `faith` so the built artifact stays `libfaith.so`/`faith.dll`, which the
# release workflow's cross-compile steps copy by name.
name = "faith"
crate-type = ["cdylib"]

[dependencies]
async-stream.workspace = true
bytes.workspace = true
futures.workspace = true
http-cache-reqwest = { workspace = true, optional = true }
napi.workspace = true
napi-derive.workspace = true
reqwest.workspace = true
reqwest-middleware.workspace = true
serde_json.workspace = true
tokio.workspace = true
web-faith = { workspace = true, features = ["unstable-internals"] }
web-faith-conn-tracker = { workspace = true, optional = true }
web-faith-cookies = { workspace = true, features = ["reqwest"], optional = true }

# The JNI entry point that gives the platform verifier its handles. Exported from this
# crate rather than web-faith because the symbol has to live in the cdylib the JVM loads,
# and because the mangled name carries the Kotlin package Faith's own Gradle module ships.
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
rustls-platform-verifier.workspace = true

[build-dependencies]
napi-build.workspace = true

[features]
default = [
    "cache",
    "connection-tracking",
    "cookies",
    "dns",
    "dyn-symbols",
    "encoding",
    "napi9",
    "http3",
    "onecrl",
    "crlite",
    "upki",
    "tls-aws-lc-rs",
]
# Resolve Node-API functions in the host process at runtime. Every Node build wants
# this. A React Native build must not have it: there is no Node host to resolve
# against, and the symbols are linked against weak-node-api instead.
dyn-symbols = ["napi/dyn-symbols"]
# The Node-API version ceiling. These are cumulative, and one of them must be on: with
# none, only Node-API 1 exists and napi's own code does not compile.
#
# 8 is as high as a React Native build can go. Node-API 9 is where the `node_api_`-prefixed
# extensions live, which Node provides and other hosts need not; weak-node-api, and so
# Hermes behind it, implements none of them. A binary built at 9 loads under Node and fails
# to `dlopen` on a device, naming whichever extension it happened to reference.
napi8 = ["napi/napi8"]
napi9 = ["napi8", "napi/napi9"]
cache = ["dep:http-cache-reqwest", "web-faith/cache"]
connection-tracking = ["dep:web-faith-conn-tracker", "web-faith/connection-tracking"]
cookies = ["dep:web-faith-cookies", "reqwest/cookies", "web-faith/cookies"]
dns = ["web-faith/dns"]
encoding = ["web-faith/encoding"]
onecrl = ["web-faith/onecrl"]
crlite = ["web-faith/crlite"]
upki = ["crlite", "web-faith/upki"]
http3 = ["reqwest/http3", "tls-aws-lc-rs", "web-faith/http3"]
tls-aws-lc-rs = ["reqwest/rustls", "web-faith/tls-aws-lc-rs"]
tls-ring = ["reqwest/rustls-no-provider", "web-faith/tls-ring"]

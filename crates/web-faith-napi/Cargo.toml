[package]
name = "web-faith-napi"
description = "Faith: a Rust-powered JS fetch (Node.js binding)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# Kept as `faith` so the built artifact stays `libfaith.so`/`faith.dll`, which the
# release workflow's cross-compile steps copy by name.
name = "faith"
crate-type = ["cdylib"]

[dependencies]
async-stream.workspace = true
bytes.workspace = true
futures.workspace = true
http-cache-reqwest = { workspace = true, optional = true }
napi.workspace = true
napi-derive.workspace = true
reqwest.workspace = true
reqwest-middleware.workspace = true
serde_json.workspace = true
tokio.workspace = true
web-faith.workspace = true
web-faith-conn-tracker = { workspace = true, optional = true }
web-faith-cookies = { workspace = true, features = ["reqwest"], optional = true }

[build-dependencies]
napi-build.workspace = true

[features]
default = ["cache", "connection-tracking", "cookies", "dns", "encoding", "http3"]
cache = ["dep:http-cache-reqwest", "web-faith/cache"]
connection-tracking = ["dep:web-faith-conn-tracker", "web-faith/connection-tracking"]
cookies = ["dep:web-faith-cookies", "reqwest/cookies", "web-faith/cookies"]
dns = ["web-faith/dns"]
encoding = ["web-faith/encoding"]
http3 = ["reqwest/http3", "web-faith/http3"]

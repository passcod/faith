[package]
name = "web-faith-cookies"
description = "A cookie jar for HTTP clients, specialised for the server-side context"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/web-faith-cookies"
authors.workspace = true

[dependencies]
cookie.workspace = true
cookie_store.workspace = true
http.workspace = true
time.workspace = true
url.workspace = true
reqwest = { workspace = true, optional = true }

[dev-dependencies]
# Doctests and examples link as their own crate, so the types the API speaks have to be named there too.
http.workspace = true
url.workspace = true

[features]
# Implement reqwest's `CookieStore`, so the jar can serve as its cookie provider.
reqwest = ["dep:reqwest", "reqwest/cookies"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

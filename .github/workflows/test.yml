name: Test
env:
  DEBUG: napi:*
  APP_NAME: faith
  MACOSX_DEPLOYMENT_TARGET: "10.13"
  CARGO_INCREMENTAL: "1"
  CFLAGS_aarch64_unknown_linux_gnu: "-D__ARM_ARCH=8"
on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - "**/*.gitignore"
      - .editorconfig
      - .rustfmt.toml
      - docs/**
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        host:
          - macos-latest
          - windows-latest
          - ubuntu-latest
        nodejs:
          - 20
          - 22
          - 24
          - 26
    name: stable - ${{ matrix.host }} - node@${{ matrix.nodejs }}
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.nodejs }}
          cache: npm
      - run: rustup toolchain install --profile minimal --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - run: npm install
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Start httpbin
        run: |
          # pinned: @latest changed the /cookies response shape in the past and
          # silently broke CI; bump deliberately
          go run github.com/mccutchen/go-httpbin/v2/cmd/go-httpbin@v2.23.1 -host 127.0.0.1 -port 8888 &
          sleep 10
        shell: bash
      - name: Install Caddy
        # The HTTP/3 tests need a real h3 server; Caddy is what downstream runs.
        # Linux only: those tests drive a userspace UDP relay and the behaviour
        # they cover is client-side, so there's nothing to gain from paying for
        # it across the whole OS x Node matrix. Pinned for the same reason as
        # httpbin above.
        if: runner.os == 'Linux'
        run: |
          go install github.com/caddyserver/caddy/v2/cmd/caddy@v2.11.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        shell: bash
      - run: npm run test
        env:
          HTTPBIN_URL: http://localhost:8888

  # Dummy job to have a stable name for PR requirements
  tests-pass:
    if: always() # always run even if dependencies fail
    name: Tests pass
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: ${{ needs.plan.outputs.allowed-skips }}

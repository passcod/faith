name: Test
env:
  DEBUG: napi:*
  APP_NAME: faith
  MACOSX_DEPLOYMENT_TARGET: "10.13"
  CARGO_INCREMENTAL: "1"
  CFLAGS_aarch64_unknown_linux_gnu: "-D__ARM_ARCH=8"
on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - "**/*.gitignore"
      - .editorconfig
      - .rustfmt.toml
      - docs/**
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The guard's artefact-cleanup commit is a new head SHA over an already-tested
  # tree. See .github/scripts/cleanup-only-gate.sh for why this is a job and not a
  # `paths-ignore` entry.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      allowed-skips: ${{ steps.decide.outputs.allowed-skips }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The branch head, not the merge ref: the comparison is against this
          # branch's previous commit. Depth 2 covers both and carries the script.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: decide
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_CHECK: Tests pass
          SKIPPABLE_JOBS: test
        run: .github/scripts/cleanup-only-gate.sh

  test:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        host:
          - macos-latest
          - windows-latest
          - ubuntu-latest
        nodejs:
          - 20
          - 22
          - 24
          - 26
    name: stable - ${{ matrix.host }} - node@${{ matrix.nodejs }}
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.nodejs }}
          cache: npm
      - run: rustup toolchain install --profile minimal --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - run: npm install
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Start httpbin
        run: |
          # pinned: @latest changed the /cookies response shape in the past and
          # silently broke CI; bump deliberately
          go run github.com/mccutchen/go-httpbin/v2/cmd/go-httpbin@v2.23.1 -host 127.0.0.1 -port 8888 &
          sleep 10
        shell: bash
      - name: Install Caddy
        # The HTTP/3 tests need a real h3 server; Caddy is what downstream runs.
        # Linux only: those tests drive a userspace UDP relay and the behaviour
        # they cover is client-side, so there's nothing to gain from paying for
        # it across the whole OS x Node matrix. Pinned for the same reason as
        # httpbin above.
        if: runner.os == 'Linux'
        run: |
          go install github.com/caddyserver/caddy/v2/cmd/caddy@v2.11.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        shell: bash
      - run: npm run test
        env:
          HTTPBIN_URL: http://localhost:8888
          # httpbin binds IPv4 only, but `localhost` resolves to `::1` as well, and
          # Windows offers that one first. Faith's own stack walks the address list and
          # lands on the listener either way; Node's fetch, which the comparison tests
          # measure Faith against, intermittently gave up on the first connection of a
          # run instead. Resolving IPv4 first points it at the address httpbin is
          # actually on. The URL stays a name because the DNS and warm-up tests need a
          # host that resolves rather than an IP literal.
          NODE_OPTIONS: --dns-result-order=ipv4first

  # Dummy job to have a stable name for PR requirements
  tests-pass:
    if: always() # always run even if dependencies fail
    name: Tests pass
    needs: [gate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          # alls-green counts a skipped dependency as a failure unless it is named
          # here, so this has to be live for a gated skip to report green.
          allowed-skips: ${{ needs.gate.outputs.allowed-skips }}

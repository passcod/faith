name: React Native

# Path-filtered on purpose. The emulator job compiles React Native and Hermes from source,
# because Node-API support lives on a Hermes branch React Native has not shipped, so it is
# far too slow to sit on every pull request. The repository is public, so this is about
# keeping a long job off unrelated changes rather than about runner minutes.
#
# The cost of that choice: a React Native release dropping out of the Hermes fork's tags,
# or the host package narrowing the versions it supports, surfaces the next time one of
# these paths changes rather than when it happens.
on:
  pull_request:
    paths: &paths
      - react-native/**
      - crates/web-faith-napi/**
      - wrapper-factory.js
      - Cargo.lock
      - .github/workflows/react-native.yml
  push:
    branches:
      - main
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # All three come from the React Native version the example pins, which declares them in
  # its own Gradle version catalog. The NDK version is also what the prebuild script
  # defaults to.
  NDK_VERSION: 27.1.12297006
  COMPILE_SDK: "36"
  BUILD_TOOLS: 36.0.0

jobs:
  # The Kotlin component the platform verifier calls over JNI is versioned in lockstep with
  # the crate, and a published npm package ships no Cargo.lock for Gradle to read the
  # version out of, so build.gradle pins it. A mismatch is a runtime crash in an app, which
  # is a long way from here, hence the check.
  verifier-version:
    name: verifier version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: The pinned Maven version matches Cargo.lock
        run: |
          locked=$(awk '/^name = "rustls-platform-verifier-android"$/{found=1; next} found && /^version = /{gsub(/[";]|version = /, ""); print; exit}' Cargo.lock)
          pinned=$(sed -n 's/.*"rustls:rustls-platform-verifier:\([^"]*\)".*/\1/p' react-native/android/build.gradle)
          echo "Cargo.lock: $locked, build.gradle: $pinned"
          test -n "$locked" && test -n "$pinned" && test "$locked" = "$pinned"

  # Catches a linkage or feature regression on the three architectures the emulator does
  # not exercise, for the price of a cargo build each and no app at all.
  cross-compile:
    name: cross-compile ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - i686-linux-android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: rustup toolchain install --profile minimal --no-self-update stable
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: android-actions/setup-android@v4
        with:
          packages: tools platform-tools ndk;${{ env.NDK_VERSION }}
      - run: npm install
        working-directory: react-native
      - run: npm run build:android -- ${{ matrix.target }}
        working-directory: react-native

  emulator:
    name: emulator
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
      - uses: android-actions/setup-android@v4
        with:
          packages: >-
            tools platform-tools
            platforms;android-${{ env.COMPILE_SDK }}
            build-tools;${{ env.BUILD_TOOLS }}
            ndk;${{ env.NDK_VERSION }} cmake;3.22.1
      - run: rustup toolchain install --profile minimal --no-self-update stable
      - run: rustup target add x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-linux-android

      - name: Build the prebuild
        # One architecture: the emulator is x86_64, and the other three are covered by the
        # cross-compile job without an app around them.
        run: |
          npm install
          npm run build:android -- x86_64-linux-android
        working-directory: react-native

      - run: npm install
        working-directory: react-native/example

      - name: Vendor the Node-API Hermes
        # React Native has not shipped a Hermes with Node-API, so the host package clones
        # the pinned commit and Gradle compiles it as part of the app build.
        run: |
          echo "REACT_NATIVE_OVERRIDE_HERMES_DIR=$(npx react-native-node-api vendor-hermes --silent)" >> "$GITHUB_ENV"
        working-directory: react-native/example

      # No Gradle version here: the example fetches the one its React Native calls for and
      # writes the wrapper itself. This action is for caching Gradle's dependency cache
      # between runs, which a build that compiles React Native from source needs.
      - uses: gradle/actions/setup-gradle@v4
      - name: Write the Gradle wrapper
        run: npm run gradle
        working-directory: react-native/example

      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Start httpbin
        # The same server and pin the Node suite uses, reached from the emulator over an
        # adb reverse tunnel so the behavioural cases stay deterministic.
        run: |
          go run github.com/mccutchen/go-httpbin/v2/cmd/go-httpbin@v2.23.1 -host 127.0.0.1 -port 8888 &
          sleep 10

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the example
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          ndk: ${{ env.NDK_VERSION }}
          cmake: 3.22.1
          working-directory: react-native/example
          script: |
            # 8090 carries the mocha-remote results back to the runner, which owns the exit
            # code; 8888 is httpbin.
            adb reverse tcp:8090 tcp:8090
            adb reverse tcp:8888 tcp:8888
            adb logcat > logcat.txt 2>&1 &
            logcat_pid=$!
            npm run test:android -- --mode Release
            sleep 5
            kill $logcat_pid || true

      - name: Upload device logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: emulator-logcat
          path: react-native/example/logcat.txt
          if-no-files-found: ignore

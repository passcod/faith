org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

android.useAndroidX=true

# The architecture filter is not set here. React Native is pulled in with
# `settings.includeBuild`, and a project property set in this file does not cross into an
# included build, so React Native and Hermes would compile for all four architectures
# whatever this said. It is passed as ORG_GRADLE_PROJECT_reactNativeArchitectures instead,
# which every build in the composite reads for itself: see the `android` script.

newArchEnabled=true

# Node-API support lives on a Hermes branch React Native has not shipped, so React Native
# and Hermes are both compiled from source against the vendored checkout that
# REACT_NATIVE_OVERRIDE_HERMES_DIR points at. This is what makes a cold build slow.
react.buildFromSource=true

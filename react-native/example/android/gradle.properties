org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

android.useAndroidX=true

# The emulator is x86_64, and building the other three costs minutes for no signal. The
# workflow overrides this with -PreactNativeArchitectures when it wants them all.
reactNativeArchitectures=x86_64

newArchEnabled=true

# Node-API support lives on a Hermes branch React Native has not shipped, so React Native
# and Hermes are both compiled from source against the vendored checkout that
# REACT_NATIVE_OVERRIDE_HERMES_DIR points at. This is what makes a cold build slow.
react.buildFromSource=true

# react-native-test-app's Gradle modules still use the old DSL and add Kotlin sources
# through `main.java.srcDirs +=`, which AGP's built-in Kotlin does not compile. Both opt
# outs go when it migrates; AGP 10 removes them.
android.builtInKotlin=false
android.newDsl=false

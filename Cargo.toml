[workspace]
members = ["crates/*"]
# The benchmark HTTP/3 server keeps its own manifest and lockfile on purpose, so
# the quinn/h3 stack stays out of this workspace's dependency graph.
exclude = ["bench/h3-server"]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/passcod/faith"
authors = ["Félix Saparelli <felix@passcod.name>"]

[workspace.dependencies]
async-compression = { version = "0.4", default-features = false, features = [
    "tokio",
    "gzip",
    "zlib",
    "brotli",
    "zstd",
] }
async-stream = "0.3.6"
async-trait = "0.1.89"
bytes = "1.9.0"
cookie = "0.18.1"
cookie_store = { version = "0.22.0", default-features = false }
futures = "0.3.31"
hickory-resolver = { version = "0.26", features = [
    "tls-aws-lc-rs",
    "https-aws-lc-rs",
    "quic-aws-lc-rs",
    "h3-aws-lc-rs",
    "rustls-platform-verifier",
] }
moka = { version = "0.12", features = ["sync"] }
http = "1.4.0"
http-body-util = "0.1.3"
hyper = "1.8.1"
http-cache-reqwest = { version = "1.0.0-alpha.6", features = [
    "manager-cacache",
    "manager-moka",
] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
libc = "0.2.179"
napi = { version = "3.7.0", features = [
    "napi9",
    "serde-json",
    "tokio_rt",
    "web_stream",
] }
napi-build = "2.3.1"
napi-derive = "3.4.0"
reqwest = { version = "0.13.4", default-features = false, features = [
    "cookies",
    "hickory-dns",
    "http2",
    "json",
    "rustls",
    "stream",
    "system-proxy",
] }
reqwest-middleware = { version = "0.5.2", features = ["http2", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
ssri = "9.2.0"
stream_shared = { version = "0.8.5", features = ["stats"] }
strum = { version = "0.27.2", features = ["derive"] }
tokio = { version = "1.48.0", features = ["full"] }
tokio-stream = "0.1.16"
time = "0.3.53"
tokio-util = { version = "0.7.10", features = ["io"] }
url = "2.5.7"
web-faith = { version = "0.7.0", path = "crates/web-faith" }
web-faith-integrity = { version = "0.7.0", path = "crates/web-faith-integrity" }
netlink-packet-core = "0.7.0"
netlink-packet-sock-diag = { version = "0.4.2", features = ["rich_nlas"] }
netlink-sys = "0.8.7"
windows = { version = "0.62.2", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }
